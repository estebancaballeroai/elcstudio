name: ELC Deep Functional QA
on:
  push:
    paths:
      - '.github/audit/deep-functional.cjs'
      - '.github/workflows/deep-functional.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deep-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: node .github/audit/deep-functional.cjs
