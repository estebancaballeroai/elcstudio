name: ELC Targeted Startup QA
on:
  push:
    paths:
      - '.github/audit/targeted-start.cjs'
      - '.github/workflows/targeted-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: node .github/audit/targeted-start.cjs
